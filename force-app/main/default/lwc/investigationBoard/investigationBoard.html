<template>
    <div class="ag">
        <!-- Masthead -->
        <header class="ag-mast">
            <div class="ag-mast__id">
                <span class="ag-mast__name">AgentTrace</span>
                <span class="ag-mast__desc">Diagnóstico de causa raiz · org Salesforce</span>
            </div>
            <div class="ag-mast__watch">
                <template lwc:if={hasSweep}>
                    <span class="ag-mast__sweep">{sweepText}</span>
                </template>
                <span class="ag-mast__watchlabel">Vigilância contínua</span>
                <button class="ag-link" onclick={handleSweep} disabled={sweeping}>Rodar varredura</button>
            </div>
        </header>

        <!-- Registrar incidente -->
        <section class="ag-intake">
            <label class="ag-fieldlabel">Incidente</label>
            <lightning-textarea class="ag-input" variant="label-hidden"
                placeholder="Descreva o sintoma. Ex.: o cálculo de desconto está errado para pedidos de exatamente R$ 100."
                value={incidentText} onchange={handleIncidentChange}></lightning-textarea>
            <div class="ag-intake__foot">
                <div class="ag-examples">
                    <span class="ag-examples__lead">Comuns:</span>
                    <template for:each={exampleChips} for:item="chip">
                        <button key={chip.key} data-text={chip.text} class="ag-example"
                            onclick={handleChip}>{chip.label}</button>
                    </template>
                </div>
                <button class="ag-btn" disabled={investigateDisabled} onclick={handleInvestigate}>Investigar</button>
            </div>
        </section>

        <!-- Esclarecimento (incidente vago) -->
        <template lwc:if={hasQuestion}>
            <section class="ag-clarify">
                <div class="ag-clarify__q"><span class="ag-kicker">Esclarecimento necessário</span> {pendingQuestion}</div>
                <div class="ag-clarify__row">
                    <lightning-input class="ag-clarify__input" type="text" variant="label-hidden"
                        placeholder="Sua resposta…" value={questionAnswer}
                        onchange={handleAnswerChange}></lightning-input>
                    <button class="ag-btn ag-btn--ghost" onclick={handleAnswer}>Responder</button>
                </div>
            </section>
        </template>

        <!-- Caso em apuração -->
        <template lwc:if={hasCase}>
            <div class="ag-casehead">
                <span class={statusClass}>{statusLabel}</span>
                <template lwc:if={usedToolsLabel}>
                    <span class="ag-facts"><span class="ag-facts__k">Ferramentas</span>{usedToolsLabel}</span>
                </template>
                <template lwc:if={hasCost}>
                    <span class="ag-facts"><span class="ag-facts__k">Execução</span>{costText}</span>
                </template>
            </div>

            <!-- Mapa da investigação: sintoma -> suspeitos (acende/apaga/descarta) -> causa -->
            <template lwc:if={hasMap}>
                <section class="ag-mapwrap">
                    <div class="ag-panel__head">Mapa da investigação</div>
                    <div class="ag-map">
                        <div class="ag-map__origin">
                            <span class="ag-node__kicker">Sintoma</span>
                            <span class="ag-node__label">{symptomShort}</span>
                        </div>
                        <span class="ag-map__arrow">→</span>
                        <div class="ag-map__suspects">
                            <template for:each={renderMap} for:item="n">
                                <div key={n.id} class={n.cssClass}>
                                    <span class={n.markClass}></span>
                                    <div class="ag-node__body">
                                        <span class="ag-node__label">{n.label}</span>
                                        <template lwc:if={n.hasDetail}>
                                            <span class="ag-node__detail">{n.detail}</span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template lwc:if={showSeeking}>
                                <div class="ag-node ag-node--seeking">
                                    <span class="ag-node__mark ag-node__mark--active"></span>
                                    <div class="ag-node__body">
                                        <span class="ag-node__label">decidindo próximo passo…</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                        <span class="ag-map__arrow">→</span>
                        <div class={causeClass}>
                            <span class="ag-node__kicker">{causeLabel}</span>
                            <template lwc:if={causeReached}>
                                <span class="ag-node__label">identificada</span>
                            </template>
                            <template lwc:else>
                                <span class="ag-node__label ag-node__label--muted">apurando…</span>
                            </template>
                        </div>
                    </div>
                    <div class="ag-maplegend">
                        <span class="ag-maplegend__item"><span class="ag-node__mark ag-node__mark--active"></span>examinando</span>
                        <span class="ag-maplegend__item"><span class="ag-node__mark ag-node__mark--evidence"></span>evidência</span>
                        <span class="ag-maplegend__item"><span class="ag-node__mark ag-node__mark--cleared"></span>descartado</span>
                    </div>
                    <template lwc:if={showThinking}>
                        <div class="ag-now">
                            <span class="ag-now__mark"></span>
                            <span class="ag-now__text">{thinkingText}</span>
                        </div>
                    </template>
                </section>
            </template>

            <div class="ag-work">
                <!-- Exame (o artefato sob a lente: código, consulta, console) -->
                <section class="ag-panel ag-panel--exam">
                    <div class="ag-panel__head">Exame</div>
                    <template lwc:if={hasScreen}>
                        <div class="ag-screen">
                            <div class="ag-screen__bar">
                                <span class="ag-screen__title">{screenTitle}</span>
                            </div>
                            <div class="ag-tabs">
                                <template for:each={screenTabs} for:item="tab">
                                    <button key={tab.id} data-id={tab.id} class={tab.cssClass}
                                        onclick={handleSelectTab}>
                                        <span class="at-tab__icon">{tab.icon}</span>{tab.label}
                                    </button>
                                </template>
                            </div>
                            <div class="at-screen__body">
                                <template for:each={screenLines} for:item="ln">
                                    <div key={ln.key} class={ln.cssClass}>
                                        <span class="at-code__num">{ln.num}</span>
                                        <span class="at-code__text">
                                            <template for:each={ln.tokens} for:item="t">
                                                <span key={t.key} class={t.cls}>{t.text}</span>
                                            </template>
                                            <template lwc:if={ln.showCursor}>
                                                <span class="at-caret"></span>
                                            </template>
                                        </span>
                                    </div>
                                </template>
                                <template lwc:if={hasConsole}>
                                    <div class="at-console-out">{screenConsole}</div>
                                </template>
                            </div>
                            <div class={screenStatusClass}>
                                <span class="at-statusbar__dot"></span>
                                <span class="at-statusbar__text">{screenStatus}</span>
                                <span class="at-statusbar__file">{screenTitle}</span>
                            </div>
                        </div>
                    </template>
                    <template lwc:else>
                        <div class="ag-empty">O código, a consulta e o console do agente aparecem aqui — ao vivo — conforme ele examina cada evidência.</div>
                    </template>
                </section>

                <!-- Registro da apuração (a trilha) -->
                <section class="ag-panel ag-panel--log">
                    <div class="ag-panel__head">Atividade</div>
                    <div class="at-timeline">
                        <template lwc:if={hasTimeline}>
                            <template for:each={renderTimeline} for:item="entry">
                                <div key={entry.key} class="at-tl-item">
                                    <span class="at-tl-rail"></span>
                                    <span class={entry.dotClass}></span>
                                    <div class="at-tl-body">
                                        <template lwc:if={entry.isText}>{entry.text}</template>
                                        <template lwc:if={entry.isCode}>
                                            <div class="at-code">
                                                <button class="at-code__bar" data-key={entry.key}
                                                    onclick={handleToggleCode}>
                                                    <span class="at-code__caret">{entry.caret}</span>
                                                    <span class="at-code__file">{entry.file}</span>
                                                </button>
                                                <template lwc:if={entry.open}>
                                                    <div class="at-code__body">
                                                        <template for:each={entry.lines} for:item="ln">
                                                            <div key={ln.key} class="at-code__line">
                                                                <span class="at-code__num">{ln.num}</span>
                                                                <span class="at-code__text">
                                                                    <template for:each={ln.tokens} for:item="t">
                                                                        <span key={t.key} class={t.cls}>{t.text}</span>
                                                                    </template>
                                                                </span>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <template lwc:if={entry.isConsole}>
                                            <div class="at-console-out">{entry.text}</div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                            <template lwc:if={isRunning}>
                                <div class="at-tl-item">
                                    <span class="at-tl-rail"></span>
                                    <span class="at-tl-dot at-tl-dot_live"></span>
                                    <div class="at-tl-body at-tl-body_live">apurando…</div>
                                </div>
                            </template>
                        </template>
                        <template lwc:else>
                            <p class="ag-empty">Cada passo da apuração — decisão, ação, achado, descarte — fica registrado aqui.</p>
                        </template>
                    </div>
                </section>
            </div>

            <!-- Diagnóstico -->
            <template lwc:if={hasSummary}>
                <section class="ag-verdict">
                    <div class="ag-verdict__label">Diagnóstico</div>
                    <p class="ag-verdict__cause">{summaryText}</p>
                    <template lwc:if={hasImpact}>
                        <div class="ag-verdict__impact">
                            <span class="ag-kicker">Impacto no negócio</span>
                            <p>{impactText}</p>
                        </div>
                    </template>
                </section>
            </template>

            <!-- Correção proposta -->
            <template lwc:if={hasFix}>
                <section class="ag-fix">
                    <div class="ag-fix__head">
                        <span class="ag-kicker">Correção proposta</span>
                        <span class="ag-fix__file">{fix.classe}</span>
                    </div>
                    <div class="ag-diff">
                        <div class="ag-diff__line ag-diff__line--del"><span class="ag-diff__sign">−</span><span>{fix.de}</span></div>
                        <div class="ag-diff__line ag-diff__line--add"><span class="ag-diff__sign">+</span><span>{fix.para}</span></div>
                    </div>
                    <p class="ag-fix__why">{fix.porque}</p>

                    <template lwc:if={fixPending}>
                        <div class="ag-fix__actions">
                            <button class="ag-btn" onclick={handleAuthorize}>Autorizar</button>
                            <button class="ag-btn ag-btn--ghost" onclick={handleReject}>Recusar</button>
                        </div>
                        <p class="ag-fix__note">O agente propõe. Nada é validado nem aplicado sem a sua decisão.</p>
                    </template>
                    <template lwc:if={fixValidating}>
                        <p class="ag-fix__state">Validando ao vivo — rodando a lógica corrigida…</p>
                    </template>
                    <template lwc:if={fixValidatedOk}>
                        <p class="ag-fix__state ag-fix__state--ok">Validada — {fix.validatedText}</p>
                        <template lwc:if={showApplyButton}>
                            <div class="ag-fix__actions">
                                <button class="ag-btn ag-btn--danger" onclick={handleApply}>Aplicar no org (deploy)</button>
                            </div>
                            <p class="ag-fix__note">Isto deploya a correção no código do org — só com o seu clique.</p>
                        </template>
                        <template lwc:if={fixApplying}>
                            <p class="ag-fix__state">Aplicando no org (deploy ao vivo)…</p>
                        </template>
                        <template lwc:if={fixApplied}>
                            <p class="ag-fix__state ag-fix__state--ok">{fix.appliedText}</p>
                        </template>
                        <template lwc:if={fixApplyFailed}>
                            <p class="ag-fix__state ag-fix__state--no">{fix.appliedText}</p>
                        </template>
                    </template>
                    <template lwc:if={fixValidatedFail}>
                        <p class="ag-fix__state ag-fix__state--no">{fix.validatedText}</p>
                    </template>
                    <template lwc:if={fixRejected}>
                        <p class="ag-fix__state ag-fix__state--no">Correção recusada. Nada foi alterado.</p>
                    </template>
                </section>
            </template>
        </template>

        <!-- Investigações recentes -->
        <template lwc:if={hasRecent}>
            <section class="ag-cases">
                <div class="ag-panel__head">Investigações recentes</div>
                <div class="ag-caselist">
                    <template for:each={recent} for:item="r">
                        <div key={r.id} class="ag-caserow" data-id={r.id} onclick={handleToggleRecent}>
                            <span class="ag-caserow__id">{r.name}</span>
                            <template lwc:if={r.auto}><span class="ag-caserow__auto">auto</span></template>
                            <span class={r.areaClass}>{r.area}</span>
                            <span class={r.statusClass}>{r.status}</span>
                            <template lwc:if={r.expanded}>
                                <span class="ag-caserow__inc ag-caserow__inc--full">{r.incidenteFull}</span>
                            </template>
                            <template lwc:else>
                                <span class="ag-caserow__inc">{r.incidente}</span>
                            </template>
                            <span class="ag-caserow__meta">{r.meta}</span>
                        </div>
                    </template>
                </div>
            </section>
        </template>
    </div>
</template>
