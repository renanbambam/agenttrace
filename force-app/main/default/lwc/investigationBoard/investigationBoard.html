<template>
    <div class="at-app">
        <!-- Cabeçalho / identidade -->
        <header class="at-header">
            <div class="at-header__brand">
                <span class="at-header__logo">🔎</span>
                <div>
                    <div class="at-header__name">AgentTrace</div>
                    <div class="at-header__tag">Investigador de causa raiz para o seu org Salesforce</div>
                </div>
            </div>
            <template lwc:if={isRunning}>
                <span class="at-header__live"><i></i> Investigando</span>
            </template>
        </header>

        <!-- Console de comando -->
        <div class="at-console">
            <lightning-textarea
                name="incident"
                variant="label-hidden"
                class="at-console__input"
                placeholder="Descreva o incidente… ou clique num exemplo abaixo"
                value={incidentText}
                onchange={handleIncidentChange}>
            </lightning-textarea>
            <div class="at-console__row">
                <div class="at-chips">
                    <template for:each={exampleChips} for:item="chip">
                        <button key={chip.key} data-text={chip.text} class="at-chip"
                            onclick={handleChip}>{chip.label}</button>
                    </template>
                </div>
                <lightning-button
                    label="Investigar"
                    variant="brand"
                    class="at-console__go"
                    disabled={investigateDisabled}
                    onclick={handleInvestigate}>
                </lightning-button>
            </div>
        </div>

        <!-- Cockpit: Tela do agente | Linha do tempo -->
        <div class="at-cockpit">
            <!-- Tela do agente -->
            <section class="at-pane">
                <p class="at-pane__title">Tela do agente</p>
                <template lwc:if={showThinking}>
                    <div class="at-thinking">
                        <span class="at-thinking__brain">🧠</span>
                        <span class="at-thinking__text">{thinkingText}</span>
                        <span class="at-thinking__dots"><i></i><i></i><i></i></span>
                    </div>
                </template>
                <template lwc:if={hasScreen}>
                    <div class="at-screen">
                        <div class="at-screen__bar">
                            <span class="at-screen__dot"></span>
                            <span class="at-screen__dot"></span>
                            <span class="at-screen__dot"></span>
                            <span class="at-screen__title">{screenTitle}</span>
                        </div>
                        <div class="at-tabs">
                            <template for:each={screenTabs} for:item="tab">
                                <button key={tab.id} data-id={tab.id} class={tab.cssClass}
                                    onclick={handleSelectTab}>
                                    <span class="at-tab__icon">{tab.icon}</span>{tab.label}
                                </button>
                            </template>
                        </div>
                        <div class="at-screen__body">
                            <template for:each={screenLines} for:item="ln">
                                <div key={ln.key} class={ln.cssClass}>
                                    <span class="at-code__num">{ln.num}</span>
                                    <span class="at-code__text">
                                        <template for:each={ln.tokens} for:item="t">
                                            <span key={t.key} class={t.cls}>{t.text}</span>
                                        </template>
                                        <template lwc:if={ln.showCursor}>
                                            <span class="at-caret"></span>
                                        </template>
                                    </span>
                                </div>
                            </template>
                            <template lwc:if={hasConsole}>
                                <div class="at-console-out">{screenConsole}</div>
                            </template>
                        </div>
                        <div class={screenStatusClass}>
                            <span class="at-statusbar__dot"></span>
                            <span class="at-statusbar__text">{screenStatus}</span>
                            <span class="at-statusbar__file">{screenTitle}</span>
                        </div>
                    </div>
                </template>
                <template lwc:else>
                    <div class="at-screen at-screen_idle">
                        <div class="at-screen__placeholder">
                            🖥️ Quando o agente abrir um arquivo, rodar um teste ou consultar dados,
                            você vê acontecer aqui — ao vivo, como uma tela compartilhada.
                        </div>
                    </div>
                </template>
            </section>

            <!-- Linha do tempo -->
            <section class="at-pane">
                <p class="at-pane__title">Linha do tempo da investigação</p>
                <div class="at-timeline">
                    <template lwc:if={hasTimeline}>
                        <template for:each={renderTimeline} for:item="entry">
                            <div key={entry.key} class="at-tl-item">
                                <span class="at-tl-rail"></span>
                                <span class={entry.dotClass}>{entry.icon}</span>
                                <div class="at-tl-body">
                                    <template lwc:if={entry.isText}>{entry.text}</template>
                                    <template lwc:if={entry.isCode}>
                                        <div class="at-code">
                                            <button class="at-code__bar" data-key={entry.key}
                                                onclick={handleToggleCode}>
                                                <span class="at-code__caret">{entry.caret}</span>
                                                <span class="at-code__file">{entry.file}</span>
                                            </button>
                                            <template lwc:if={entry.open}>
                                                <div class="at-code__body">
                                                    <template for:each={entry.lines} for:item="ln">
                                                        <div key={ln.key} class="at-code__line">
                                                            <span class="at-code__num">{ln.num}</span>
                                                            <span class="at-code__text">
                                                                <template for:each={ln.tokens} for:item="t">
                                                                    <span key={t.key} class={t.cls}>{t.text}</span>
                                                                </template>
                                                            </span>
                                                        </div>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                    <template lwc:if={entry.isConsole}>
                                        <div class="at-console-out">{entry.text}</div>
                                    </template>
                                </div>
                            </div>
                        </template>
                        <template lwc:if={isRunning}>
                            <div class="at-tl-item">
                                <span class="at-tl-rail"></span>
                                <span class="at-tl-dot at-tl-dot_live">•</span>
                                <div class="at-tl-body at-tl-body_live">raciocinando…</div>
                            </div>
                        </template>
                    </template>
                    <template lwc:else>
                        <p class="at-timeline__empty">Cada passo do raciocínio do agente aparece aqui — pensando, decidindo, vasculhando, achando.</p>
                    </template>
                </div>
            </section>
        </div>

        <!-- Pergunta de esclarecimento (incidente vago) -->
        <template lwc:if={hasQuestion}>
            <div class="at-question">
                <div class="at-question__head">🤔 O agente precisa de um esclarecimento</div>
                <p class="at-question__text">{pendingQuestion}</p>
                <div class="at-question__row">
                    <lightning-input type="text" variant="label-hidden"
                        class="at-question__input" placeholder="Responda aqui…"
                        value={questionAnswer} onchange={handleAnswerChange}></lightning-input>
                    <lightning-button label="Responder" variant="brand"
                        onclick={handleAnswer}></lightning-button>
                </div>
            </div>
        </template>

        <!-- Card de laudo (conclusão) -->
        <template lwc:if={hasSummary}>
            <div class="at-diag">
                <div class="at-diag__head"><span class="at-diag__badge">📋 Diagnóstico técnico</span></div>
                <p class="at-diag__text">{summaryText}</p>
            </div>
        </template>

        <!-- Impacto no negócio (linguagem de executivo) -->
        <template lwc:if={hasImpact}>
            <div class="at-impact">
                <div class="at-impact__head"><span class="at-impact__badge">💼 Impacto no negócio</span></div>
                <p class="at-impact__text">{impactText}</p>
            </div>
        </template>

        <!-- Custo/uso desta investigação -->
        <template lwc:if={hasCost}>
            <div class="at-cost">💰 Custo desta investigação: {costText}</div>
        </template>

        <!-- Correção proposta -->
        <template lwc:if={hasFix}>
            <div class="at-fix">
                <div class="at-fix__head">
                    <span class="at-fix__badge">Correção proposta</span>
                    <span class="at-fix__file">{fix.classe}</span>
                </div>
                <div class="at-fix__diff">
                    <div class="at-fix__line at-fix__line_del">
                        <span class="at-fix__sign">-</span><span>{fix.de}</span>
                    </div>
                    <div class="at-fix__line at-fix__line_add">
                        <span class="at-fix__sign">+</span><span>{fix.para}</span>
                    </div>
                </div>
                <p class="at-fix__why">{fix.porque}</p>

                <template lwc:if={fixPending}>
                    <div class="at-fix__actions">
                        <lightning-button label="Autorizar correção" variant="brand"
                            onclick={handleAuthorize}></lightning-button>
                        <lightning-button label="Recusar" variant="neutral"
                            class="slds-m-left_x-small" onclick={handleReject}></lightning-button>
                    </div>
                    <p class="at-fix__note">O agente propõe — nada é aplicado sem a sua autorização.</p>
                </template>
                <template lwc:if={fixValidating}>
                    <p class="at-fix__decided at-fix__decided_ok">⏳ Validando a correção ao vivo — rodando a lógica corrigida…</p>
                </template>
                <template lwc:if={fixValidatedOk}>
                    <p class="at-fix__decided at-fix__decided_ok">✅ Correção validada — {fix.validatedText} Aplicar continua sendo a sua decisão; o agente não aplica sozinho.</p>
                </template>
                <template lwc:if={fixValidatedFail}>
                    <p class="at-fix__decided at-fix__decided_no">⚠️ {fix.validatedText}</p>
                </template>
                <template lwc:if={fixRejected}>
                    <p class="at-fix__decided at-fix__decided_no">✋ Correção recusada. Nada foi alterado.</p>
                </template>
            </div>
        </template>

        <!-- Capacidades usadas nesta investigação -->
        <div class="at-caps">
            <p class="at-pane__title">Capacidades do agente</p>
            <div class="at-caps__grid">
                <template for:each={capabilityPanel} for:item="cap">
                    <span key={cap.name} class={cap.cssClass}>{cap.label}</span>
                </template>
            </div>
        </div>

        <!-- Histórico (memória institucional) -->
        <template lwc:if={hasRecent}>
            <div class="at-recent">
                <p class="at-pane__title">Investigações recentes</p>
                <div class="at-recent__list">
                    <template for:each={recent} for:item="r">
                        <div key={r.id} class="at-recent__item">
                            <div class="at-recent__top">
                                <span class="at-recent__name">{r.name}</span>
                                <span class={r.areaClass}>{r.area}</span>
                                <span class="at-recent__status">{r.status}</span>
                                <span class="at-recent__meta">{r.meta}</span>
                            </div>
                            <div class="at-recent__inc">{r.incidente}</div>
                        </div>
                    </template>
                </div>
            </div>
        </template>
    </div>
</template>
